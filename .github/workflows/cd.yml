# ─────────────────────────────────────────────────────────────────────────────
# cd.yml — Entrega Contínua — service-order-service
#
# QUANDO RODA:
#   - Somente quando há push na branch main
#
# O QUE FAZ:
#   Job 1 — docker:
#     1. Compila o projeto
#     2. Build da imagem Docker localmente
#
#   Job 2 — deploy:
#     3. Aplica Namespace e ConfigMap
#     4. Cria Secrets com as credenciais reais
#     5. Deploy da aplicação
#     6. Aplica Service, Ingress e HPA
#     7. Aguarda app ficar pronta
#     8. Mostra status final
#
# REQUISITOS:
#   - Self-hosted Runner rodando na sua máquina
#   - Docker Desktop com Kubernetes habilitado
#   - Secrets do GitHub configurados
#
# SECRETS NECESSÁRIOS:
#   DB_PASSWORD           → senha do banco
#   MYSQL_ROOT_PASSWORD   → senha root do MySQL
# ─────────────────────────────────────────────────────────────────────────────
name: CD — Deploy Local Kubernetes

on:
  push:
    branches: [ main ]

env:
  DOCKER_IMAGE: service-order-service
  DOCKER_TAG: latest
  NAMESPACE: fiap-oficina
  DEPLOYMENT_NAME: service-order-service

jobs:

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1 — Build da imagem Docker local
  # ───────────────────────────────────────────────────────────────────────────
  docker:
    name: 🐳 Build Docker Local
    runs-on: self-hosted

    steps:

      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: ☕ Configura Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: 📦 Gera o JAR
        run: mvn package -DskipTests -B

      - name: 🐳 Build da imagem Docker
        run: |
          docker build -t ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }} .
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ Imagem criada: ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: 🔍 Confirma imagem criada
        run: docker images | grep ${{ env.DOCKER_IMAGE }}


  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2 — Deploy no Kubernetes local (Docker Desktop)
  # ───────────────────────────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy Kubernetes Local
    runs-on: self-hosted
    needs: docker

    steps:

      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: 🔍 Verifica cluster Kubernetes
        run: |
          kubectl get nodes
          echo "Cluster acessível ✅"

      # ── 1/6 Namespace ────────────────────────────────────────────────────
      - name: 📦 1/6 — Namespace
        run: |
          kubectl apply -f k8s/00-namespace.yaml
          echo "Namespace '${{ env.NAMESPACE }}' ✅"

      # ── 2/6 ConfigMap e Secrets (via Kustomize / .env) ───────────────────
      - name: ⚙️ 2/6 — ConfigMap e Secrets
        run: |
          if [ ! -f k8s/.env ]; then
            cp k8s/.env.example k8s/.env
          fi
          kubectl apply -k k8s/
          echo "ConfigMap e Secrets gerados via Kustomize ✅"

      # ── 3/6 Secrets ──────────────────────────────────────────────────────
      - name: 🔐 3/6 — Secrets
        run: |
          kubectl create secret generic oficina-secrets \
            --namespace=${{ env.NAMESPACE }} \
            --from-literal=DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            --from-literal=MYSQL_ROOT_PASSWORD="${{ secrets.MYSQL_ROOT_PASSWORD }}" \
            --save-config \
            --dry-run=client \
            -o yaml | kubectl apply -f -
          echo "Secrets ✅"

      # ── 4/6 Deploy da aplicação ───────────────────────────────────────────
      - name: 🚀 4/6 — Deploy da aplicação
        run: |
          kubectl apply -f k8s/app/04-deployment.yaml
          kubectl apply -f k8s/app/05-service.yaml
          kubectl apply -f k8s/app/06-hpa.yaml
          echo "Manifests aplicados ✅"

      # ── Reinicia os pods para pegar a imagem nova ─────────────────────────
      - name: 🔄 Reinicia os pods (pega imagem nova)
        run: |
          kubectl rollout restart deployment/${{ env.DEPLOYMENT_NAME }} \
            --namespace=${{ env.NAMESPACE }}
          echo "Restart solicitado ✅"

      # ── 5/6 Aguarda a aplicação ficar pronta ─────────────────────────────
      - name: ⏳ 5/6 — Aguarda aplicação
        run: |
          echo "Aguardando pods ficarem Running..."
          kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }} \
            --namespace=${{ env.NAMESPACE }} \
            --timeout=180s
          echo "Aplicação pronta ✅"

      # ── 6/6 Status final ──────────────────────────────────────────────────
      - name: 📋 6/6 — Status final
        if: always()
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📦 PODS"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          kubectl get pods -n ${{ env.NAMESPACE }}
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "⚡ HPA"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          kubectl get hpa -n ${{ env.NAMESPACE }}
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Para acessar:"
          echo "kubectl port-forward service/${{ env.DEPLOYMENT_NAME }} 8080:80 -n ${{ env.NAMESPACE }}"
          echo "Swagger: http://localhost:8080/swagger-ui.html"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      # ── Rollback automático se o deploy falhar ────────────────────────────
      - name: 🔄 Rollback (se falhar)
        if: failure()
        run: |
          echo "❌ Deploy falhou! Revertendo..."
          kubectl rollout undo deployment/${{ env.DEPLOYMENT_NAME }} \
            --namespace=${{ env.NAMESPACE }}
          echo "✅ Rollback realizado"
