# ─────────────────────────────────────────────────────────────────────────────
# ci.yml — Integração Contínua (100% Local)
#
# QUANDO RODA:
#   - Todo push em qualquer branch
#   - Todo Pull Request aberto para a main
#
# O QUE FAZ:
#   1. Compila o projeto
#   2. Roda todos os testes (usa H2 em memória — sem MySQL)
#   3. Gera o JAR
#
# REQUISITO:
#   Self-hosted Runner instalado na sua máquina.
#   Sem Docker Hub, sem cloud, tudo local.
# ─────────────────────────────────────────────────────────────────────────────
name: CI — Build e Testes

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main ]

jobs:

  build-and-test:
    name: 🔨 Build e Testes
    runs-on: self-hosted

    steps:

      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: ☕ Configura Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: 🔨 Compila o projeto
        run: mvn clean compile -B

      - name: 🧪 Executa os testes e gera relatório de cobertura JaCoCo
        run: mvn test -B
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: 🔍 Análise de Qualidade (SonarQube)
        uses: sonarsource/sonarqube-scan-action@v2
        # SonarQube Quality Gate — build falha se não passar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: 📦 Gera o JAR
        run: mvn package -DskipTests -B

      - name: ✅ Build finalizado
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ Build, testes e análise de qualidade concluídos com sucesso"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
