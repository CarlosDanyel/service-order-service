version: '3.9'

services:
  mysql:
    image: mysql:8.2
    container_name: fiap-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: oficina_db
      MYSQL_USER: oficina_user
      MYSQL_PASSWORD: oficina_pass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - fiap-network
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fiap-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: oficina_db
      DB_USERNAME: oficina_user
      DB_PASSWORD: oficina_pass
      RESEND_API_KEY: ${RESEND_API_KEY:-re_seu_api_key_aqui}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-oficina@fabrincahub.com}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
    ports:
      - "8080:8080"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - fiap-network

volumes:
  mysql_data:
    driver: local

networks:
  fiap-network:
    driver: bridge
