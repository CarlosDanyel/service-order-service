apiVersion: v1
kind: ConfigMap
metadata:
  name: oficina-config
  namespace: fiap-oficina
  labels:
    app: tech-challenge-fase2
data:
  DB_HOST: "mysql"
  DB_PORT: "3306"
  DB_NAME: "oficina_db"
  DB_USERNAME: "oficina_user"
  APP_BASE_URL: "https://api.oficina.com"
  RESEND_FROM_EMAIL: "oficina@fabrincahub.com"
  SPRING_JPA_SHOW_SQL: "false"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "validate"
  LOGGING_LEVEL_COM_FIAP: "INFO"
