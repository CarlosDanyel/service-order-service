spring.application.name=tech-challenge-fase2

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:oficina_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:oficina_user}
spring.datasource.password=${DB_PASSWORD:oficina_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

server.port=8080

resend.api-key=${RESEND_API_KEY:re_placeholder}
resend.from-email=oficina@fabrincahub.com

app.base-url=${APP_BASE_URL:http://localhost:8080}

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.tags-sorter=alpha

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

logging.level.com.fiap.tech_challenge_fase2=DEBUG
logging.level.org.hibernate.SQL=WARN

server.servlet.context-path=/api